<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
        <link rel="stylesheet" href="login.css" />
        <title>Unauthorised Error</title>
        <style>
            :root {
                --primary: #4a4a4a;
                --secondary: #7d7d7d;
                --accent: #616161;
                --light: #ffffff;
                --dark: #2d2d2d;
                --gray: #e0e0e0;
                --text-light: #757575;
                --text-dark: #424242;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }

            body {
                background-attachment: fixed;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                position: relative;
                overflow: hidden;
            }

            body::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                opacity: 0.05;
                pointer-events: none;
            }

            .main-content {
                width: 100%;
                max-width: 1200px;
                padding: 2rem;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: space-between;
            }

            .header {
                margin-bottom: 2rem;
                text-align: center;
            }

            .logo-space {
                background-color: rgba(255, 255, 255, 0.9);
                border-radius: 50%;
                width: 180px;
                height: 180px;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
                margin: 0 auto;
                transition: transform 0.3s ease;
            }

            .logo-space:hover {
                transform: scale(1.05);
            }

            .form-container {
                background: rgba(255, 255, 255, 0.95);
                border-radius: 20px;
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
                width: 100%;
                max-width: 450px;
                padding: 3rem;
                position: relative;
                overflow: hidden;
            }

            .form-container::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                width: 5px;
                height: 100%;
                background: linear-gradient(to bottom, var(--primary), var(--secondary));
            }

            .form-box h1 {
                font-size: 2.2rem;
                margin-bottom: 2.5rem;
                color: var(--primary);
                position: relative;
                text-align: center;
                font-weight: 700;
            }

            .form-box h1::after {
                content: '';
                width: 50px;
                height: 4px;
                border-radius: 3px;
                background: linear-gradient(to right, var(--primary), var(--secondary));
                position: absolute;
                bottom: -15px;
                left: 50%;
                transform: translateX(-50%);
            }

            @media (max-width: 768px) {
                .form-container {
                    padding: 2rem;
                }

                .logo-space {
                    width: 150px;
                    height: 150px;
                }
            }


            #backBtn {
                width: 100%;
                padding: 15px;
                border: none;
                border-radius: 8px;
                background: linear-gradient(to right, var(--primary), var(--secondary));
                color: white;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s;
                box-shadow: 0 4px 15px rgba(60, 0, 160, 0.3);
                text-align: center;
                text-decoration: none;
                display: inline-block;
            }

            #backBtn:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(60, 0, 160, 0.4);
            }

            .run-link {
                text-align: center;
                margin-top: 2rem;
                color: var(--text-light);
            }

            .run-link a {
                color: var(--dark);
                font-weight: 600;
                text-decoration: none;
                transition: color 0.3s;
            }

            .run-link a:hover {
                color: var(--primary);
                text-decoration: underline;
            }

            @media (max-width: 768px) {
                .form-container {
                    padding: 2rem;
                }

                .logo-space {
                    width: 150px;
                    height: 150px;
                }
            }

            .link-container {
                display: flex;
                justify-content: space-between;
                margin: 1rem 0 2rem;
            }

            .link-container a {
                color: var(--text-dark);
                font-size: 0.9rem;
                transition: color 0.3s;
                text-decoration: none;
                font-weight: 500;
            }

            .link-container a:hover {
                color: var(--primary);
                text-decoration: underline;
            }



            .form-box {
                display: flex;
                flex-direction: column;
                align-items: center;
                height: 100%;
            }

            .form-box h1 {
                font-size: 2.0rem;
                margin-bottom: 1.5rem;
                color: var(--primary);
                position: relative;
                text-align: center;
                font-weight: 700;
            }

            .error-icon {
                font-size: 5rem;
                color: #e74c3c;
                margin: 2rem 0;
                text-align: center;
            }

            .error-icon p{
                font-size: 18px;
                color: #e74c3c;
                text-align: center;
                padding: 1rem;
            }


            .btn-container {
                display: flex;
                justify-content: center;
                width: 100%;
                margin-top: auto;
                padding-top: 18px;
            }
        </style>
    </head>
    <body>
        <main class="main-content">
            <div class="header">
                <a href="#" class="logo-space">
                    <img src="../Images/LOGO3.png" alt="Four Eyes Collective Logo" style="height: 120px;">
                </a>
            </div>

            <div class="form-container">
                <div class="form-box">
                    <h1>Unauthorised Error</h1>
                    <div class="error-icon">
                        <i class="fas fa-exclamation-circle"></i>
                        <p>You are not authorized for this!</p>

                    </div>
                    <div class="btn-container">
                        <a href="../ManagementRoleSelection.jsp" id="backBtn">Back</a>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
