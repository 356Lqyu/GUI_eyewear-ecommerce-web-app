<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
        <link rel="stylesheet" href="login.css" />
        <title>Four Eyes Collective - Login Error</title>
        <style>
            .form-box {
                display: flex;
                flex-direction: column;
                align-items: center;
                height: 100%;
            }

            .form-box h1 {
                font-size: 2.0rem;
                margin-bottom: 1.5rem;
                color: var(--primary);
                position: relative;
                text-align: center;
                font-weight: 700;
            }

            .error-icon {
                font-size: 5rem;
                color: #e74c3c;
                margin: 2rem 0;
                text-align: center;
            }

            .error-icon p{
                font-size: 18px;
                color: #e74c3c;
                text-align: center;
                padding: 1rem;
            }


            .btn-container {
                display: flex;
                justify-content: center;
                width: 100%;
                margin-top: auto;
                padding-top: 18px;
            }
        </style>
    </head>
    <body>
        <main class="main-content">
            <div class="header">
                <a href="#" class="logo-space">
                    <img src="Images/LOGO3.png" alt="Four Eyes Collective Logo" style="height: 120px;">
                </a>
            </div>

            <!-- Show login error message -->
            <div class="form-container">
                <div class="form-box">
                    <h1>Login Error</h1>
                    <div class="error-icon">
                        <i class="fas fa-exclamation-circle"></i>
                        <p>Invalid username or password. </br> Please try again.</p>

                    </div>
                    <div class="btn-container">
                        <a href="ManagementLogin.jsp" id="runBtn">Return to Login</a>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
